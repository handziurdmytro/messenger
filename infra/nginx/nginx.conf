server {
    listen 2901;

    add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    location = /auth/validate {
        internal;
        proxy_pass http://auth-service:2902/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/auth/ {
        proxy_pass http://auth-service:2902/;
    }

    location /api/users/ {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-ID $user_id;
        proxy_pass http://user-service:2903/;
    }

    location /api/chat/ {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-ID $user_id;
        proxy_pass http://chat-service:2904/;
    }

    location /api/messages/ {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-ID $user_id;
        proxy_pass http://message-service:2906/;
    }

    location /ws {
        proxy_pass http://chat-service:2905/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
