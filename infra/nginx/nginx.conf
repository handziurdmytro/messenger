log_format gateway '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

map $http_sec_websocket_protocol $gateway_authorization {
    default $http_authorization;
    "~^[A-Za-z0-9._-]+$" "Bearer $http_sec_websocket_protocol";
}

server {
    listen 80;

    client_max_body_size 130M;
    access_log /var/log/nginx/access.log gateway;

    add_header 'Access-Control-Allow-Origin' 'http://localhost:5173' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Request-ID' always;

    if ($request_method = 'OPTIONS') {
        return 204;
    }

    location = /auth/validate {
        internal;
        proxy_pass http://auth-service:2902/validate$is_args$args;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $gateway_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }

    location /api/auth/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://auth-service:2902/;
    }

    location /api/users/ {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-ID $user_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://user-service:2903/;
    }

    location /api/chat/ {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-ID $user_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://chat-service:2904/chats;
    }

    location /api/chats/ {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-ID $user_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://chat-service:2904/chats/;
    }

    location /api/messages/ {
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-ID $user_id;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://message-service:2906/;
    }

    location = /ws {
        add_header Sec-WebSocket-Protocol $http_sec_websocket_protocol always;
        auth_request /auth/validate;
        auth_request_set $user_id $upstream_http_x_user_id;

        proxy_set_header X-User-ID $user_id;
        proxy_set_header Sec-WebSocket-Protocol "";
        proxy_pass http://chat-service:2904/ws;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
