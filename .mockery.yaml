template: testify
formatter: goimports
force-file-write: true

packages:
  github.com/handziurdmytro/messenger/auth-service/internal/port/outbound:
    config:
      all: true
      dir: '{{.InterfaceDir}}/../../usecase'
      filename: mocks_test.go
      pkgname: usecase

  github.com/handziurdmytro/messenger/auth-service/internal/adapter/inbound/rest:
    config:
      all: true
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: rest

  github.com/handziurdmytro/messenger/user-service/internal/port/outbound:
    config:
      all: true
      dir: '{{.InterfaceDir}}/../../usecase'
      filename: mocks_test.go
      pkgname: usecase
    interfaces:
      UserRepository:
        configs:
          - dir: '{{.InterfaceDir}}/../../usecase'
            filename: mocks_test.go
            pkgname: usecase
          - dir: services/user-service/internal/adapter/inbound/nats
            filename: outbound_mocks_test.go
            pkgname: nats

  github.com/handziurdmytro/messenger/user-service/internal/adapter/inbound/rest:
    config:
      all: true
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: rest

  github.com/handziurdmytro/messenger/user-service/internal/adapter/inbound/nats:
    config:
      all: true
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: nats

  github.com/handziurdmytro/messenger/chat-service/internal/usecase:
    config:
      all: true
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: usecase

  github.com/handziurdmytro/messenger/chat-service/internal/adapter/inbound/rest:
    config:
      all: true
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: rest

  github.com/handziurdmytro/messenger/chat-service/internal/adapter/inbound/nats:
    config:
      all: true
      exclude-interface-regex: '^validatable$'
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: nats

  github.com/handziurdmytro/messenger/message-service/internal/usecase:
    config:
      all: true
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: usecase

  github.com/handziurdmytro/messenger/message-service/internal/adapter/inbound/rest:
    config:
      all: true
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: rest

  github.com/handziurdmytro/messenger/pkg/natskit:
    config:
      all: true
      dir: '{{.InterfaceDir}}'
      filename: mocks_test.go
      pkgname: natskit

  github.com/nats-io/nats.go/jetstream:
    interfaces:
      Msg:
        configs:
          - dir: services/user-service/internal/adapter/inbound/nats
            filename: jetstream_mocks_test.go
            pkgname: nats
          - dir: services/chat-service/internal/adapter/inbound/nats
            filename: jetstream_mocks_test.go
            pkgname: nats
      JetStream:
        configs:
          - dir: services/user-service/internal/adapter/inbound/nats
            filename: jetstream_mocks_test.go
            pkgname: nats
          - dir: services/chat-service/internal/adapter/inbound/nats
            filename: jetstream_mocks_test.go
            pkgname: nats
