asyncapi: 2.6.0
info:
  title: Messenger WebSocket API
  version: 1.0.0
  description: WebSocket API for real-time chat communication.
servers:
  api-gateway:
    url: ws://{host}:{port}/ws/chat
    protocol: ws
    variables:
      host:
        default: localhost
        description: API Gateway host
      port:
        default: "2901"
    security:
      - bearerAuth: []
channels:
  /:
    description: Main chat connection channel. Requires room_id query parameter and X-User-ID header (or auth via gateway).
    bindings:
      ws:
        query:
          type: object
          properties:
            room_id:
              type: string
              description: The ID of the room the user is joining.
          required:
            - room_id
        headers:
          type: object
          properties:
            X-User-ID:
              type: string
              description: Automatically injected by API Gateway from auth token.
    publish:
      summary: Send a message to the room
      description: The client sends this structure to publish a message to the chat room.
      message:
        $ref: '#/components/messages/IncomingMessage'
    subscribe:
      summary: Receive messages from the room
      description: The client will receive broadcasted messages from other users in the room, or confirmation messages.
      message:
        $ref: '#/components/messages/OutgoingMessage'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  messages:
    IncomingMessage:
      name: IncomingMessage
      payload:
        type: object
        required:
          - body
          - type
        properties:
          body:
            type: string
            description: The text content of the message.
          type:
            type: string
            enum: [text, system]
            description: The type of message being sent.
    OutgoingMessage:
      name: OutgoingMessage
      payload:
        type: object
        properties:
          ID:
            type: string
          RoomID:
            type: string
          FromUser:
            type: string
          Type:
            type: string
            enum: [text, system, confirm]
          Body:
            type: string
          CreatedAt:
            type: string
            format: date-time