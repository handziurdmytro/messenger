routes:
  - id: auth
    prefix: /api/auth
    target: http://auth-service:3131
    strip_prefix: true
    auth_required: false

  - id: chat
    prefix: /api/chat
    target: http://chat-service:3232
    strip_prefix: true
    auth_required: true

  - id: chat-ws
    prefix: /ws/chat
    target: http://chat-service:3232
    strip_prefix: false
    auth_required: true

  - id: users
    prefix: /api/users
    target: http://user-service:3333
    strip_prefix: true
    auth_required: true
