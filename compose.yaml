name: messenger

networks:
  messenger-net:
    driver: bridge

volumes:
  postgres-auth-data:
  postgres-user-data:
  postgres-chat-data:
  scylla-data:
  nats-data:
  rustfs-data:
  grafana-data:
  loki-data:

services:
  postgres-auth:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
    networks: [ messenger-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d auth" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      postgres-auth:
        condition: service_healthy
    volumes:
      - ./services/auth-service/migrations:/migrations:ro
    networks: [ messenger-net ]
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres-auth:5432/auth?sslmode=disable
      - up

  postgres-user:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks: [ messenger-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d users" ]
      interval: 5s
      timeout: 5s
      retries: 5

  user-migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      postgres-user:
        condition: service_healthy
    volumes:
      - ./services/user-service/migrations:/migrations:ro
    networks: [ messenger-net ]
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres-user:5432/users?sslmode=disable
      - up

  postgres-chat:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-chat-data:/var/lib/postgresql/data
    networks: [ messenger-net ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d chats" ]
      interval: 5s
      timeout: 5s
      retries: 5

  chat-migrate:
    image: migrate/migrate:v4.19.0
    depends_on:
      postgres-chat:
        condition: service_healthy
    volumes:
      - ./services/chat-service/migrations:/migrations:ro
    networks: [ messenger-net ]
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres-chat:5432/chats?sslmode=disable
      - up

  scylla:
    image: scylladb/scylla:6.0
    command: --smp 1 --memory 750M --overprovisioned 1
    volumes:
      - scylla-data:/var/lib/scylla
    networks: [ messenger-net ]
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 15

  scylla-migrate:
    image: scylladb/scylla:6.0
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./services/message-service/migrations:/migrations:ro
      - ./scripts/init-scylla.sh:/init-scylla.sh:ro
    networks: [ messenger-net ]
    entrypoint: [ "/bin/bash", "/init-scylla.sh" ]

  rustfs:
    image: rustfs/rustfs:latest
    command: /data
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks: [ messenger-net ]

  rustfs-init:
    image: amazon/aws-cli:latest
    depends_on:
      rustfs:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadminpassword
      AWS_DEFAULT_REGION: us-east-1
    networks: [ messenger-net ]
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do sleep 1; done &&
      aws --endpoint-url http://rustfs:9000 s3 mb s3://messenger-files 2>/dev/null || true
      "

  nats:
    image: nats:2.10-alpine
    command: [ "-js", "-sd", "/data", "-m", "8222" ]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks: [ messenger-net ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  nats-init:
    image: natsio/nats-box:latest
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./scripts/init-nats.sh:/init-nats.sh:ro
    networks: [ messenger-net ]
    entrypoint: [ "/bin/sh", "/init-nats.sh" ]

  auth-service:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        SERVICE: auth-service
    depends_on:
      postgres-auth:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    ports:
      - "2902:2902"
    environment:
      SERVER_PORT: 2902
      POSTGRES_DSN: postgres://postgres:postgres@postgres-auth:5432/auth?sslmode=disable
      POSTGRES_MAX_CONNS: 10
      POSTGRES_MIN_IDLE_CONNS: 2
      POSTGRES_MAX_CONN_LIFETIME: 30m
      POSTGRES_MAX_CONN_LIFETIME_JITTER: 5m
      POSTGRES_MAX_CONN_IDLE_TIME: 5m
      POSTGRES_HEALTH_CHECK_PERIOD: 30s
      POSTGRES_CONNECT_TIMEOUT: 5s
      TOKEN_PRIVATE_KEY_PATH: /keys/private.pem
      TOKEN_ACCESS_TTL: 15m
      TOKEN_REFRESH_TTL: 720h
      NATS_URLS: nats://nats:4222
      NATS_NAME: auth-service
      NATS_OUTBOX_INTERVAL: 1s
      LOG_LEVEL: INFO
    volumes:
      - ./services/auth-service/keys:/keys:ro
    networks: [ messenger-net ]
    labels:
      - "logs.sink=operational,security"

  user-service:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        SERVICE: user-service
    depends_on:
      postgres-user:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 2903
      POSTGRES_DSN: postgres://postgres:postgres@postgres-user:5432/users?sslmode=disable
      NATS_URLS: nats://nats:4222
      NATS_NAME: user-service
      NATS_STREAM: USERS
      NATS_CONSUMER: user-created
      LOG_LEVEL: INFO
    networks: [ messenger-net ]
    labels:
      - "logs.sink=operational"

  chat-service:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        SERVICE: chat-service
    depends_on:
      postgres-chat:
        condition: service_healthy
      chat-migrate:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 2904
      POSTGRES_DSN: postgres://postgres:postgres@postgres-chat:5432/chats?sslmode=disable
      NATS_URLS: nats://nats:4222
      NATS_NAME: chat-service
      NATS_STREAM: MESSAGES
      NATS_CONSUMER: chat-message-created
      LOG_LEVEL: INFO
    networks: [ messenger-net ]
    labels:
      - "logs.sink=operational"

  message-service:
    build:
      context: .
      dockerfile: build/Dockerfile
      args:
        SERVICE: message-service
    depends_on:
      scylla:
        condition: service_healthy
      scylla-migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: 2906
      SCYLLA_HOSTS: scylla
      SCYLLA_KEYSPACE: messenger_messages
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: us-east-1
      S3_BUCKET: messenger-files
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadminpassword
      NATS_URLS: nats://nats:4222
      NATS_NAME: message-service
      NATS_STREAM: MESSAGES
      NATS_CONSUMER: message-send
      LOG_LEVEL: INFO
    networks: [ messenger-net ]
    labels:
      - "logs.sink=operational"

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      chat-service:
        condition: service_started
      message-service:
        condition: service_started
    ports:
      - "80:80"
    networks: [ messenger-net ]
    labels:
      - "logs.sink=operational"

  loki:
    image: grafana/loki:3.2.0
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [ messenger-net ]
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.4.0
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    command: [ "run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy" ]
    networks: [ messenger-net ]

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    networks: [ messenger-net ]
