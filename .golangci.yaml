version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - revive
    - gocritic
    - gosec
    - bodyclose
    - noctx
    - errorlint
    - exhaustive
    - misspell
    - nolintlint
    - unconvert
    - unparam
    - predeclared
    - copyloopvar
    - contextcheck
    - durationcheck
    - fatcontext
    - sqlclosecheck
    - nilnesserr

  settings:
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: error-naming
        - name: unused-parameter
    staticcheck:
      checks:
        - all
    gocritic:
      enable-all: true
      disabled-checks:
        - hugeParam
        - rangeValCopy

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - revive
          - gocritic

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/handziurdmytro/messenger

issues:
  max-issues-per-linter: 0
  max-same-issues: 0