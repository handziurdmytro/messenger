version: "2"

sql:
  - engine: "postgresql"
    schema: "./services/auth-service/migrations"
    queries: "./services/auth-service/internal/adapter/outbound/postgres/queries"

    gen:
      go:
        package: "db"
        out: "./services/auth-service/internal/adapter/outbound/postgres/sqlc"
        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: false
        emit_exact_table_names: false

        overrides:
          - column: "users.created_at"
            go_type:
              import: "time"
              type: "Time"

          - column: "refresh_tokens.created_at"
            go_type:
              import: "time"
              type: "Time"

          - column: "refresh_tokens.expires_at"
            go_type:
              import: "time"
              type: "Time"